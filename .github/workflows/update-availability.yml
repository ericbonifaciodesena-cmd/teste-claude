name: Atualizar disponibilidade

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wizardly-pasteur-tmp5zb
    paths:
      - scripts/update_availability.py

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/wizardly-pasteur-tmp5zb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Processar calendários iCal
        run: python3 scripts/update_availability.py
        env:
          AIRBNB_ICAL_URL:  ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}

      - name: Salvar disponibilidade.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add disponibilidade.json
          git diff --cached --quiet || git commit -m "Atualizar disponibilidade [skip ci]"
          git push origin claude/wizardly-pasteur-tmp5zb
